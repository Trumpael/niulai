<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="description" content="会说话的牛来：一只会说牛语的小牛犊，摸它、喂它、给它打扮，还能带它跑酷赚草币。">
<meta name="theme-color" content="#BFE0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="会说话的牛来">
<meta property="og:description" content="摸它、喂它、给它打扮，还能带它跑酷赚草币。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%237FA855%22%2F%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2236%22%20rx%3D%2220%22%20ry%3D%2217%22%20fill%3D%22%23E8B96A%22%2F%3E%3Cpath%20d%3D%22M17%2022Q13%2014%2015%208Q23%2011%2029%2020Z%22%20fill%3D%22%23EFE3C8%22%20stroke%3D%22%232E2A22%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M47%2022Q51%2014%2049%208Q41%2011%2035%2020Z%22%20fill%3D%22%23EFE3C8%22%20stroke%3D%22%232E2A22%22%20stroke-width%3D%222%22%2F%3E%3Cellipse%20cx%3D%2225%22%20cy%3D%2233%22%20rx%3D%225%22%20ry%3D%225.5%22%20fill%3D%22%23FFFDF6%22%20stroke%3D%22%232E2A22%22%20stroke-width%3D%221.6%22%2F%3E%3Cellipse%20cx%3D%2239%22%20cy%3D%2233%22%20rx%3D%225%22%20ry%3D%225.5%22%20fill%3D%22%23FFFDF6%22%20stroke%3D%22%232E2A22%22%20stroke-width%3D%221.6%22%2F%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2234%22%20r%3D%222.4%22%20fill%3D%22%232E2A22%22%2F%3E%3Ccircle%20cx%3D%2239%22%20cy%3D%2234%22%20r%3D%222.4%22%20fill%3D%22%232E2A22%22%2F%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2245%22%20rx%3D%2211%22%20ry%3D%228%22%20fill%3D%22%23F3D9AC%22%20stroke%3D%22%232E2A22%22%20stroke-width%3D%221.8%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html,body{height:100%;}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif;background:#faf9f7;}
img{max-width:100%;}
[hidden]{display:none!important;}

<title>会说话的牛来</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{
  --hide:#E8B96A; --hide-d:#D2A257; --hide-dd:#B98A44; --belly:#F6DFB4;
  --muzzle:#F3D9AC; --lip:#E3A184; --ink:#2E2A22; --horn:#EFE3C8;
  --grass:#7FA855; --grass-d:#5C8A44; --grass-dd:#436B33;
  --sky-1:#BFE0E8; --sky-2:#E7EAD6; --sky-3:#F2D9A8;
  --hill:#9AB877; --hill-far:#AFC7A0;
  --zhu:#C2452D; --zhu-d:#9B3320; --dian:#2F6E7A; --gold:#E8B34A;
  --cream:#FFF6E2; --panel:#FFFBF0; --shade:#6B5B45;
  --night:#1E2A44;
  --ui:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
body{
  margin:0;background:var(--sky-2);color:var(--ink);font-family:var(--body);
  overflow:hidden;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#app{position:relative;height:100%;width:100%;overflow:hidden;display:flex;flex-direction:column;}

/* ---------- 场景 ---------- */
#scene{position:absolute;inset:0;overflow:hidden;}
#sky{position:absolute;inset:0;background:linear-gradient(#BFE0E8 0%,#D7E6DF 42%,#F2D9A8 74%,#EFCF96 100%);}
#sun{position:absolute;right:13%;top:9%;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#FFF6DA,#F6D896 62%,#EFC377);
  box-shadow:0 0 44px 18px rgba(246,216,150,.5);}
.cloud{position:absolute;background:#FFFDF4;border-radius:999px;opacity:.85;
  box-shadow:0 8px 0 -2px rgba(155,175,175,.15);}
#c1{width:120px;height:34px;left:8%;top:13%;}
#c2{width:82px;height:26px;left:34%;top:8%;opacity:.7;}
#c3{width:150px;height:40px;left:62%;top:20%;opacity:.6;}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;}
.cloud::before{width:56%;height:170%;left:14%;bottom:26%;}
.cloud::after{width:40%;height:135%;right:12%;bottom:22%;}
#hills{position:absolute;left:-6%;right:-6%;bottom:29%;height:30%;}
.hill{position:absolute;bottom:0;border-radius:50% 50% 0 0;}
#h1{left:-4%;width:58%;height:100%;background:var(--hill-far);}
#h2{right:-8%;width:64%;height:78%;background:var(--hill);}
#h3{left:26%;width:44%;height:56%;background:#8FAE6E;}
#ground{position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(var(--grass) 0%,var(--grass-d) 55%,var(--grass-dd) 100%);}
#ground::before{content:"";position:absolute;left:0;right:0;top:-10px;height:20px;
  background:radial-gradient(circle at 10px 12px,var(--grass) 9px,transparent 10px) repeat-x;
  background-size:20px 20px;}
.tuft{position:absolute;bottom:0;width:4px;border-radius:3px 3px 0 0;
  background:linear-gradient(#8FB962,#4F7A38);}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;}

/* ---------- 舞台 / 角色 ---------- */
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:2%;z-index:2;transition:transform .28s cubic-bezier(.3,1.1,.5,1);}
#app.lift #stage{transform:translateY(-16vh) scale(.84);}
#niulai{width:min(86vw,min(58vh,430px));height:auto;overflow:visible;cursor:grab;}
#niulai:active{cursor:grabbing;}
.hit{fill:transparent;stroke:none;cursor:pointer;}
#pao{position:absolute;right:-42%;bottom:6%;width:min(40vw,190px);height:auto;
  transition:right .9s cubic-bezier(.34,1.3,.64,1);z-index:3;pointer-events:none;}
#pao.in{right:3%;}

/* ---------- HUD ---------- */
#hud{position:relative;z-index:4;display:flex;align-items:flex-start;gap:8px;
  padding:10px 14px 0;}
#title{font-family:var(--brush);font-size:clamp(20px,5.6vw,30px);line-height:1;color:var(--zhu-d);
  text-shadow:0 2px 0 rgba(255,255,255,.7);margin:0;letter-spacing:1px;flex:0 0 auto;}
#title small{display:block;font-family:var(--ui);font-size:10px;color:var(--shade);
  letter-spacing:2px;margin-top:3px;text-shadow:none;}
#stats{margin-left:auto;display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--ui);font-size:11px;color:var(--shade);}
.stat b{font-weight:400;width:1.6em;text-align:right;}
.bar{width:74px;height:9px;border-radius:99px;background:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 2px rgba(110,90,60,.22);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease;}
#barHunger i{background:linear-gradient(90deg,#E9A13B,#F2C05E);}
#barMood i{background:linear-gradient(90deg,#D2553A,#EE8A6B);}
#barEnergy i{background:linear-gradient(90deg,#2F6E7A,#5AA3A8);}
#coins{display:flex;align-items:center;gap:5px;font-family:var(--ui);font-size:14px;color:var(--zhu-d);
  background:rgba(255,251,240,.86);border-radius:99px;padding:3px 11px 3px 7px;
  box-shadow:0 2px 0 rgba(140,110,70,.2);}
#coins svg{width:16px;height:16px;flex:0 0 auto;}
#coins b{font-family:var(--body);font-weight:700;font-variant-numeric:tabular-nums;}

/* ---------- 气泡 ---------- */
#bubble{position:absolute;z-index:5;left:50%;transform:translate(-50%,6px) scale(.86);
  top:clamp(72px,16vh,132px);max-width:min(72vw,340px);
  background:#FFFBF0;border:2px solid var(--ink);border-radius:16px;
  padding:9px 14px;font-family:var(--ui);font-size:clamp(13px,3.6vw,16px);line-height:1.45;
  color:var(--ink);box-shadow:0 4px 0 rgba(46,42,34,.18);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .22s cubic-bezier(.34,1.4,.64,1);
  text-align:center;word-break:break-word;}
#bubble.show{opacity:1;transform:translate(-50%,0) scale(1);}
#bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-9px;
  width:0;height:0;border:9px solid transparent;border-top-color:var(--ink);}
#bubble::before{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;z-index:1;
  width:0;height:0;border:7px solid transparent;border-top-color:var(--panel);}

/* ---------- 工具栏 ---------- */
#bar{position:relative;z-index:4;display:flex;justify-content:center;gap:clamp(6px,2vw,12px);
  padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(rgba(67,107,51,0),rgba(52,84,40,.42));}
.tool{width:clamp(46px,13vw,58px);height:clamp(46px,13vw,58px);border-radius:18px;
  border:2px solid var(--ink);background:var(--cream);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  box-shadow:0 3px 0 rgba(46,42,34,.32);transition:transform .1s ease,box-shadow .1s ease,background .15s;
  font-family:var(--ui);font-size:9px;color:var(--shade);padding:0;}
.tool svg{width:clamp(20px,5.6vw,25px);height:clamp(20px,5.6vw,25px);display:block;}
.tool:active,.tool.on{transform:translateY(3px);box-shadow:0 0 0 rgba(46,42,34,.3);background:#FFE9BD;}
.tool:focus-visible{outline:3px solid var(--dian);outline-offset:2px;}

/* ---------- 面板 ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;
  background:var(--panel);border-top:3px solid var(--ink);border-radius:20px 20px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.3,1.1,.5,1);
  box-shadow:0 -6px 24px rgba(46,42,34,.18);}
.sheet.open{transform:translateY(0);}
.sheet h3{margin:0 0 10px;font-family:var(--ui);font-size:15px;color:var(--zhu-d);
  display:flex;align-items:center;gap:8px;}
.sheet h3 span{font-family:var(--body);font-size:11px;font-weight:400;color:var(--shade);}
.close{margin-left:auto;border:0;background:none;font-size:20px;line-height:1;color:var(--shade);
  cursor:pointer;padding:0 2px;}
.close:focus-visible{outline:2px solid var(--dian);outline-offset:2px;}
.row{display:flex;gap:9px;flex-wrap:wrap;}
.chip{border:2px solid var(--ink);background:var(--cream);border-radius:14px;padding:8px 12px;
  font-family:var(--ui);font-size:13px;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 0 rgba(46,42,34,.28);display:flex;align-items:center;gap:6px;}
.chip:active{transform:translateY(2px);box-shadow:none;}
.chip:focus-visible{outline:3px solid var(--dian);outline-offset:2px;}
.chip.locked{opacity:.55;}
.chip.sel{background:#FFE0A8;border-color:var(--zhu-d);}
.chip em{font-style:normal;font-family:var(--body);font-size:11px;color:var(--zhu-d);
  font-variant-numeric:tabular-nums;}
.hintline{margin:10px 0 0;font-size:11px;color:var(--shade);line-height:1.5;}
.inputrow{display:flex;gap:8px;align-items:stretch;}
#say{flex:1;min-width:0;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;
  font-family:var(--body);font-size:15px;background:var(--cream);color:var(--ink);}
#say:focus{outline:3px solid var(--dian);outline-offset:1px;}
#sayBtn{border:2px solid var(--ink);background:var(--zhu);color:#FFF6E2;border-radius:14px;
  padding:0 18px;font-family:var(--ui);font-size:15px;cursor:pointer;
  box-shadow:0 3px 0 rgba(46,42,34,.32);flex:0 0 auto;}
#sayBtn:active{transform:translateY(3px);box-shadow:none;}
#sayBtn:focus-visible{outline:3px solid var(--dian);outline-offset:2px;}

/* ---------- 特效 ---------- */
.fx{position:absolute;font-size:22px;line-height:1;pointer-events:none;will-change:transform,opacity;}
@keyframes floatUp{
  0%{transform:translate(-50%,0) scale(.5) rotate(0deg);opacity:0;}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1.08) rotate(6deg);}
  100%{transform:translate(-50%,-92px) scale(.82) rotate(-10deg);opacity:0;}}
@keyframes crumb{
  0%{transform:translate(-50%,0) scale(1);opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx,20px)),46px) scale(.6);opacity:0;}}
@keyframes zzz{
  0%{transform:translate(-50%,0) scale(.6);opacity:0;}
  25%{opacity:.95;}
  100%{transform:translate(calc(-50% + 34px),-74px) scale(1.3);opacity:0;}}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
  40%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(.9);opacity:0;}}
#night{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;
  background:radial-gradient(60% 45% at 50% 62%,rgba(30,42,68,.28),rgba(20,30,52,.86));
  transition:opacity .7s ease;}
#night.on{opacity:1;}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFF6E2;opacity:.9;}

/* ---------- 跑酷 ---------- */
#runner{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;
  background:linear-gradient(#A8D3DE 0%,#CFE2D5 46%,#EFD3A0 78%,#E5C288 100%);}
#runner.on{display:flex;}
#rTop{display:flex;align-items:center;gap:10px;padding:10px 14px 0;font-family:var(--ui);
  color:#3C4A2E;font-size:13px;z-index:3;}
#rTop b{font-family:var(--body);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;color:var(--zhu-d);}
#rQuit{margin-left:auto;border:2px solid var(--ink);background:var(--cream);border-radius:12px;
  padding:5px 12px;font-family:var(--ui);font-size:12px;cursor:pointer;color:var(--ink);
  box-shadow:0 2px 0 rgba(46,42,34,.28);}
#rField{position:relative;flex:1;min-height:0;overflow:hidden;}
#runner{--gh:34%;}
#rGround{position:absolute;left:0;right:0;bottom:0;height:var(--gh);
  background:linear-gradient(var(--grass) 0%,var(--grass-d) 42%,var(--grass-dd) 100%);
  border-top:3px solid #3E6330;}
#rGround::before{content:"";position:absolute;left:0;right:0;top:-9px;height:18px;
  background:radial-gradient(circle at 9px 11px,var(--grass) 8px,transparent 9px) repeat-x;
  background-size:18px 18px;}
#rStripe{position:absolute;left:0;bottom:0;height:var(--gh);width:200%;opacity:.4;
  background:repeating-linear-gradient(90deg,transparent 0 44px,#6E9749 44px 50px);}
.rHill{position:absolute;bottom:var(--gh);border-radius:50% 50% 0 0;background:var(--hill-far);opacity:.7;}
#rShadow{position:absolute;bottom:var(--gh);left:11%;width:clamp(116px,32vw,168px);height:14px;
  margin-bottom:-7px;border-radius:50%;background:#2F5226;opacity:.32;z-index:2;}
#rRunner{position:absolute;left:11%;bottom:var(--gh);width:clamp(116px,32vw,168px);height:auto;
  transform-origin:50% 100%;}
.obs{position:absolute;bottom:var(--gh);will-change:transform;}
#rOver{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;z-index:4;
  padding-top:8%;background:rgba(46,42,34,.22);}
#rOver.on{display:flex;}
#rCard{background:var(--panel);border:3px solid var(--ink);border-radius:20px;padding:18px 22px;
  text-align:center;box-shadow:0 6px 0 rgba(46,42,34,.3);max-width:80%;}
#rCard h4{margin:0 0 6px;font-family:var(--ui);font-size:19px;color:var(--zhu-d);}
#rCard p{margin:0 0 14px;font-size:13px;color:var(--shade);line-height:1.6;}
#rCard p b{font-family:var(--body);font-variant-numeric:tabular-nums;color:var(--ink);}
#rAgain{border:2px solid var(--ink);background:var(--zhu);color:#FFF6E2;border-radius:14px;
  padding:9px 20px;font-family:var(--ui);font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(46,42,34,.32);}
#rHint{position:absolute;left:50%;bottom:calc(var(--gh) + 78px);transform:translateX(-50%);font-family:var(--ui);
  font-size:13px;color:#3C4A2E;background:rgba(255,251,240,.86);padding:5px 14px;border-radius:99px;
  z-index:3;transition:opacity .3s;white-space:nowrap;
  box-shadow:0 2px 0 rgba(62,99,48,.25);}
@media (prefers-reduced-motion:reduce){
  .cloud,#pao{transition:none;}
  .fx{animation-duration:.01ms!important;}
}
</style>
</head>
<body>
<div id="app">
  <div id="scene" aria-hidden="true">
    <div id="sky"></div>
    <div id="sun"></div>
    <div class="cloud" id="c1"></div>
    <div class="cloud" id="c2"></div>
    <div class="cloud" id="c3"></div>
    <div id="hills"><div class="hill" id="h1"></div><div class="hill" id="h3"></div><div class="hill" id="h2"></div></div>
    <div id="ground"></div>
  </div>

  <header id="hud">
    <h1 id="title">会说话的牛来<small>草原·迁徙中</small></h1>
    <div id="stats">
      <div id="coins" title="草币">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="#E8B34A" stroke="#2E2A22" stroke-width="1.7"/><circle cx="12" cy="12" r="5.4" fill="none" stroke="#9B3320" stroke-width="1.4"/><path d="M9.6 12h4.8M12 9.6v4.8" stroke="#9B3320" stroke-width="1.4" stroke-linecap="round"/></svg>
        <b id="coinN">0</b>
      </div>
      <div class="stat"><span>饱食</span><span class="bar" id="barHunger"><i></i></span><b id="nHunger">0</b></div>
      <div class="stat"><span>心情</span><span class="bar" id="barMood"><i></i></span><b id="nMood">0</b></div>
      <div class="stat"><span>体力</span><span class="bar" id="barEnergy"><i></i></span><b id="nEnergy">0</b></div>
    </div>
  </header>

  <div id="bubble" role="status" aria-live="polite"></div>

  <main id="stage">
    <svg id="niulai" viewBox="0 0 400 420" role="img" aria-label="小牛牛来，可以点它的头、角、肚子、尾巴和蹄子">
      <ellipse cx="200" cy="404" rx="108" ry="13" fill="#4E7A3B" opacity=".34"/>

      <!-- 尾巴 -->
      <g id="gTail">
        <path id="tailPath" d="M282 300 q30 16 26 50" fill="none" stroke="var(--hide-dd)" stroke-width="9" stroke-linecap="round"/>
        <path d="M306 349 q10 12 2 22 q-10 -4 -12 -16z" fill="var(--ink)"/>
      </g>

      <!-- 后腿 / 前腿 -->
      <g id="gLegs">
        <g id="legBL"><rect x="236" y="330" width="26" height="62" rx="12" fill="var(--hide-d)"/><rect x="235" y="374" width="28" height="20" rx="9" fill="var(--ink)"/></g>
        <g id="legFL"><rect x="138" y="332" width="26" height="60" rx="12" fill="var(--hide-d)"/><rect x="137" y="374" width="28" height="20" rx="9" fill="var(--ink)"/></g>
        <g id="legBR"><rect x="206" y="336" width="28" height="58" rx="13" fill="var(--hide)"/><rect x="205" y="376" width="30" height="20" rx="9" fill="#3A342A"/></g>
        <g id="legFR"><rect x="166" y="336" width="28" height="58" rx="13" fill="var(--hide)"/><rect x="165" y="376" width="30" height="20" rx="9" fill="#3A342A"/></g>
      </g>

      <!-- 身体 -->
      <g id="gBody">
        <ellipse cx="200" cy="288" rx="92" ry="70" fill="var(--hide)"/>
        <ellipse cx="200" cy="310" rx="62" ry="44" fill="var(--belly)" opacity=".92"/>
        <path d="M250 232 q26 10 30 34 q-18 -16 -34 -18z" fill="var(--hide-d)" opacity=".7"/>
        <ellipse cx="252" cy="268" rx="20" ry="15" fill="var(--hide-dd)" opacity=".45" transform="rotate(-18 252 268)"/>

<script>
"use strict";
const $ = (s)=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= 声音：全部实时合成 ================= */
const Audio2 = (()=>{
  let ctx=null, master=null;
  function ac(){
    if(!ctx){
      const C = window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      ctx=new C();
      master=ctx.createGain(); master.gain.value=.5; master.connect(ctx.destination);
    }
    if(ctx.state==="suspended") ctx.resume().catch(()=>{});
    return ctx;
  }
  function env(g,t,a,d,peak){
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(peak,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  }
  // 一声“哞”：锯齿 + 共振峰，音高先上后落
  function moo(len=.85,base=150,vol=.42){
    const c=ac(); if(!c) return; const t=c.currentTime;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain();
    const f1=c.createBiquadFilter(), f2=c.createBiquadFilter();
    o.type="sawtooth"; o2.type="triangle";
    o.frequency.setValueAtTime(base*.8,t);
    o.frequency.linearRampToValueAtTime(base*1.18,t+len*.22);
    o.frequency.linearRampToValueAtTime(base*.62,t+len);
    o2.frequency.setValueAtTime(base*.5,t);
    o2.frequency.linearRampToValueAtTime(base*.38,t+len);
    f1.type="peaking"; f1.frequency.value=620; f1.Q.value=6; f1.gain.value=13;
    f2.type="lowpass"; f2.frequency.setValueAtTime(1500,t);
    f2.frequency.linearRampToValueAtTime(700,t+len);
    env(g,t,.07,len,vol);
    o.connect(f1); o2.connect(f1); f1.connect(f2); f2.connect(g); g.connect(master);
    o.start(t); o2.start(t); o.stop(t+len+.1); o2.stop(t+len+.1);
  }
  // 一个牛语音节
  function syl(freq,len,vol,openVowel){
    const c=ac(); if(!c) return; const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter(), fm=c.createBiquadFilter();
    o.type="sawtooth";
    o.frequency.setValueAtTime(freq*.94,t);
    o.frequency.linearRampToValueAtTime(freq,t+len*.3);
    o.frequency.linearRampToValueAtTime(freq*.9,t+len);
    f.type="peaking"; f.frequency.value=openVowel?780:430; f.Q.value=7; f.gain.value=15;
    fm.type="lowpass"; fm.frequency.value=openVowel?2100:1200;
    env(g,t,.028,len,vol);
    o.connect(f); f.connect(fm); fm.connect(g); g.connect(master);
    o.start(t); o.stop(t+len+.06);
  }
  function blip(freq,len,type,vol){
    const c=ac(); if(!c) return; const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
    env(g,t,.01,len,vol||.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+len+.05);
  }
  function slide(f0,f1,len,type,vol){
    const c=ac(); if(!c) return; const t=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+len);
    env(g,t,.012,len,vol||.26);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+len+.05);
  }
  function noise(len,cut,vol,q){
    const c=ac(); if(!c) return; const t=c.currentTime;
    const n=Math.floor(c.sampleRate*len);
    const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(); s.buffer=buf;
    const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=cut||1400; f.Q.value=q||1.1;
    const g=c.createGain(); env(g,t,.01,len,vol||.22);
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
  }
  return {
    ac, moo, syl,
    laugh(){ const c=ac(); if(!c) return;
      [0,.13,.25,.36,.45].forEach((d,i)=>setTimeout(()=>syl(300-i*16,.1,.3,true),d*1000)); },
    happy(){ [523,659,784].forEach((f,i)=>setTimeout(()=>blip(f,.13,"triangle",.24),i*80)); },
    coin(){ blip(988,.08,"square",.2); setTimeout(()=>blip(1319,.16,"square",.18),75); },
    jump(){ slide(340,760,.16,"triangle",.24); },
    bonk(){ slide(220,70,.32,"sawtooth",.3); noise(.16,600,.2); },
    crunch(){ noise(.1,900,.26,.8); setTimeout(()=>noise(.09,1500,.2,.9),110); setTimeout(()=>noise(.1,700,.22,.8),230); },
    snore(){ slide(90,140,.5,"sawtooth",.14); setTimeout(()=>slide(150,80,.5,"triangle",.1),520); },
    dizzy(){ [0,1,2,3,4,5].forEach(i=>setTimeout(()=>blip(500-i*55,.09,"sine",.16),i*70)); },
    purr(){ slide(120,96,.3,"sawtooth",.1); },
    stomp(){ noise(.12,240,.3,.6); slide(150,60,.18,"sine",.22); },
    burp(){ slide(180,90,.3,"sawtooth",.24); },
    dull(){ slide(196,160,.6,"triangle",.2); },
    chime(){ [659,880].forEach((f,i)=>setTimeout(()=>blip(f,.22,"sine",.16),i*110)); }
  };
})();

/* ================= 状态 ================= */
const KEY="niulai.save.v1";
const S={hunger:72,mood:80,energy:88,coins:12,best:0,hat:"none",owned:["none"],last:Date.now()};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return;
    const o=JSON.parse(raw);
    if(!o||typeof o!=="object") return;
    ["hunger","mood","energy","coins","best"].forEach(k=>{ if(typeof o[k]==="number"&&isFinite(o[k])) S[k]=o[k]; });
    if(typeof o.hat==="string") S.hat=o.hat;
    if(Array.isArray(o.owned)) S.owned=o.owned.filter(x=>typeof x==="string");
    if(!S.owned.includes("none")) S.owned.push("none");
    if(typeof o.last==="number") S.last=o.last;
    // 离线衰减：按真实时间，最多折算 8 小时
    const mins=clamp((Date.now()-S.last)/60000,0,480);
    S.hunger=clamp(S.hunger-mins*.22,0,100);
    S.mood=clamp(S.mood-mins*.13,0,100);

const el={
  svg:$("#niulai"), head:$("#gHead"), body:$("#gBody"), tail:$("#gTail"), legs:$("#gLegs"),
  earL:$("#earL"), earR:$("#earR"), lidL:$("#lidL"), lidR:$("#lidR"),
  pupL:$("#pupL"), pupR:$("#pupR"), open:$("#gOpen"), mouthOpen:$("#mouthOpen"),
  mouthLine:$("#mouthLine"), browL:$("#browL"), browR:$("#browR"),
  blushL:$("#blushL"), blushR:$("#blushR"), bell:$("#gBell"), hat:$("#gHat"),
  legFR:$("#legFR"), legFL:$("#legFL"), bubble:$("#bubble"), fx:$("#fx")
};
const A={
  t:0, blinkAt:1.6, blink:0, sleeping:false, dazed:0,
  shake:0, dizzy:0, laugh:0, hop:0, stomp:0, chew:0, pet:0, annoy:0, nod:0,
  look:{x:0,y:0,tx:0,ty:0}, mouth:0, mouthTarget:0, headTilt:0
};
function act(k,v){ A[k]=v; }

function lidH(h){
  el.lidL.setAttribute("height",h.toFixed(1));
  el.lidR.setAttribute("height",h.toFixed(1));
}
function smile(){ el.mouthLine.setAttribute("d","M176 228 q24 12 48 0"); }
function flat(){ el.mouthLine.setAttribute("d","M176 232 q24 0 48 0"); }
function frown(){ el.mouthLine.setAttribute("d","M176 234 q24 -10 48 0"); }

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; A.t+=dt;
  const t=A.t;

  // 计时器衰减
  ["shake","dizzy","laugh","hop","stomp","chew","pet","annoy","dazed","nod"].forEach(k=>{
    if(A[k]>0) A[k]=Math.max(0,A[k]-dt);
  });

  const sleep=A.sleeping;
  const breathe=Math.sin(t*(sleep?1.1:2.1))*(sleep?.045:.022);
  const idleBob=Math.sin(t*1.7)*(sleep?1.2:2.6);

  /* 眨眼 */
  if(sleep){ lidH(34); }
  else{
    A.blinkAt-=dt;
    if(A.blinkAt<=0){ A.blink=.16; A.blinkAt=rnd(2.2,5.4); }
    if(A.blink>0){
      A.blink-=dt;
      const p=1-Math.abs(A.blink/.16-.5)*2;
      lidH(34*clamp(p,0,1));
    } else if(A.dazed>0){ lidH(11); }
    else lidH(0);
  }

  /* 眼神跟随 */
  A.look.x+=(A.look.tx-A.look.x)*Math.min(1,dt*7);
  A.look.y+=(A.look.ty-A.look.y)*Math.min(1,dt*7);
  let px=A.look.x*5.5, py=A.look.y*4.5;
  if(A.dizzy>0){ px=Math.cos(t*13)*5; py=Math.sin(t*13)*4; }
  if(sleep||A.dazed>0){ px=0; py=A.dazed>0?3:0; }
  el.pupL.setAttribute("transform",`translate(${px.toFixed(1)},${py.toFixed(1)})`);
  el.pupR.setAttribute("transform",`translate(${px.toFixed(1)},${py.toFixed(1)})`);

  /* 嘴 */
  if(A.chew>0) A.mouthTarget=(Math.sin(t*17)>0)?1:.15;
  A.mouth+=(A.mouthTarget-A.mouth)*Math.min(1,dt*18);
  if(A.mouth>.03){
    el.open.setAttribute("opacity","1");
    el.mouthOpen.setAttribute("ry",(2.5+A.mouth*8.5).toFixed(1));
    el.mouthOpen.setAttribute("rx",(15+A.mouth*8).toFixed(1));
    $("#tongue").setAttribute("cy",(231+A.mouth*4).toFixed(1));
  } else el.open.setAttribute("opacity","0");

  if(A.laugh>0) smile();
  else if(A.annoy>0) frown();
  else if(A.dazed>0) flat();
  else if(S.mood<28) frown();
  else smile();

  /* 眉毛 */
  const bY = A.annoy>0 ? 5 : (A.dazed>0 ? 3 : 0);
  el.browL.setAttribute("transform",`translate(0,${bY})`);
  el.browR.setAttribute("transform",`translate(0,${bY})`);

  /* 腮红 */
  const blush = clamp((A.pet>0?.6:0)+(A.laugh>0?.45:0)+(S.mood>82?.22:0),0,.6);
  el.blushL.setAttribute("opacity",blush.toFixed(2));
  el.blushR.setAttribute("opacity",blush.toFixed(2));

  /* 耳朵 */
  const earBase=sleep?-6:0;
  const flick=Math.sin(t*.9)>.96?Math.sin(t*26)*9:0;
  const earA=earBase+flick+(A.laugh>0?Math.sin(t*15)*6:0);
  el.earL.setAttribute("transform",`rotate(${(-earA).toFixed(1)} 130 148)`);
  el.earR.setAttribute("transform",`rotate(${(earA).toFixed(1)} 270 148)`);

  /* 头 */
  let hx=0, hy=idleBob*.5, hr=A.headTilt;
  if(A.shake>0) hx=Math.sin(A.shake*42)*9;
  if(A.dizzy>0) hr=Math.sin(t*9)*11;
  if(A.laugh>0){ hy+=Math.sin(t*16)*4; hr+=Math.sin(t*8)*3; }
  if(A.nod>0) hy+=Math.sin((0.5-A.nod)*30)*5;
  if(sleep) { hy+=7; hr=-7; }
  if(A.pet>0) hy-=3;
  el.head.setAttribute("transform",`translate(${hx.toFixed(1)},${hy.toFixed(1)}) rotate(${hr.toFixed(1)} 200 210)`);

  /* 身体呼吸 */
  const sy=1+breathe+(A.laugh>0?Math.sin(t*16)*.02:0);
  const sx=1-breathe*.5;
  el.body.setAttribute("transform",`translate(200,300) scale(${sx.toFixed(4)},${sy.toFixed(4)}) translate(-200,-300)`);

  /* 铃铛摆动 */
  const bellR=(A.shake>0?Math.sin(A.shake*42)*22:0)+(A.hop>0?Math.sin(t*20)*16:0)+Math.sin(t*1.7)*3;
  el.bell.setAttribute("transform",`rotate(${bellR.toFixed(1)} 200 262)`);

  /* 尾巴 */
  const tw=Math.sin(t*(sleep?1:2.6))*(sleep?6:14)+(A.laugh>0?Math.sin(t*14)*10:0);
  el.tail.setAttribute("transform",`rotate(${tw.toFixed(1)} 282 300)`);

  /* 整体跳跃 / 踏步 */
  let gy=0, gs=1;
  if(A.hop>0){ const p=1-A.hop/.5; gy=-Math.sin(p*Math.PI)*46; gs=1+Math.sin(p*Math.PI)*.03; }
  if(A.stomp>0){
    const k=Math.sin((0.45-A.stomp)*34);
    el.legFR.setAttribute("transform",`translate(0,${(k>0?-13*k:0).toFixed(1)})`);
    el.legFL.setAttribute("transform",`translate(0,${(k<0?13*k:0).toFixed(1)})`);
  } else { el.legFR.removeAttribute("transform"); el.legFL.removeAttribute("transform"); }
  el.svg.style.transform=`translateY(${gy.toFixed(1)}px) scale(${gs.toFixed(3)})`;

  requestAnimationFrame(loop);
}

/* ================= 牛语合成 ================= */
// 把任意文字变成一串牛语音节：音高由字符码决定（同句话音调稳定）
const SCALE=[0,2,4,7,9,12,14];
function speakCow(text,onDone){
  const chars=[...text].filter(c=>!/\s/.test(c)).slice(0,24);
  if(!chars.length){ onDone&&onDone(); return; }
  Audio2.ac();
  let i=0;
  const base=138;
  const step=()=>{
    if(i>=chars.length){
      A.mouthTarget=0;
      onDone&&onDone();
      return;
    }
    const code=chars[i].codePointAt(0);
    const deg=SCALE[code%SCALE.length];
    const oct=(code>>3)%2 ? 1 : 0;
    const freq=base*Math.pow(2,(deg+oct*5)/12);
    const openVowel=(code%3)!==0;
    const len=0.13+ (code%5)*0.022;
    Audio2.syl(freq,len,.3,openVowel);
    A.mouthTarget=openVowel?1:.45;
    A.nod=.32;
    setTimeout(()=>{ A.mouthTarget=.05; },len*1000*.8);
    i++;
    setTimeout(step,len*1000+52);
  };
  step();
}
function sayIt(text){
  const t=(text||"").trim();
  if(!t) return;
  if(A.sleeping) wake();
  bubble(t,Math.max(1800,t.length*280));
  speakCow(t,()=>{ hearts(1,"head"); });
  gain("mood",4);
}

  A.look.ty=clamp((e.clientY-(r.top+r.height*.4))/(r.height/2),-1,1);
  if(!petting) return;
  const dx=e.clientX-petLastX, dy=e.clientY-petLastY;
  petDist+=Math.hypot(dx,dy); petAcc+=Math.hypot(dx,dy);
  petLastX=e.clientX; petLastY=e.clientY;
  if(petDist>90){
    petDist=0; A.pet=1.0;
    if(A.sleeping){ Audio2.snore(); return; }
    Audio2.purr(); gain("mood",1.5);
    if(petAcc>340){ petAcc=0; hearts(2,"body"); bubble("哞～舒服",1200); }
  }
});

  setTimeout(()=>{ bubble("一起走一段？哞——",2000); Audio2.moo(.9,144); },1900);
  setTimeout(()=>{ pao.classList.remove("in"); },3800);
  setTimeout(()=>{ paoBusy=false; },4800);
}

/* ================= 常用短语 ================= */
const PRESETS=["牛来你好","要迁徙了吗","豹拉在哪","我饿了","哞哞哞","别发呆啦"];
function buildPresets(){
  const box=$("#presets"); box.innerHTML="";
  PRESETS.forEach(p=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=p;
    b.addEventListener("click",()=>{ $("#say").value=p; sayIt(p); });
    box.appendChild(b);
  });
}

/* ================= 定时衰减 ================= */
setInterval(()=>{
  S.hunger=clamp(S.hunger-.45,0,100);
  S.mood=clamp(S.mood-(A.sleeping?.1:.3),0,100);
  S.energy=clamp(S.energy+(A.sleeping?2.4:.22),0,100);
  hud(); save();
  if(!A.sleeping && Math.random()<.24){
    if(S.hunger<22){ Audio2.moo(.7,132); bubble("哞……饿了",2000); A.dazed=1.2; }
    else if(S.mood<25){ bubble("有点没劲",1800); }
    else if(Math.random()<.3){ A.shake=.2; }
  }
},9000);

/* ================= 按钮 ================= */
$("#tTalk").addEventListener("click",()=>{ Audio2.ac(); openSheet("sheetTalk"); });
$("#tFeed").addEventListener("click",()=>{ Audio2.ac(); openSheet("sheetFeed"); });
$("#tHat").addEventListener("click",()=>{ Audio2.ac(); openSheet("sheetHat"); });

/* ================= 跑酷 ================= */
const R={on:false,y:0,vy:0,ground:true,dist:0,speed:340,obs:[],spawn:0,over:false,t:0,raf:0};
const rField=$("#rField"), rRunner=$("#rRunner"), rStripe=$("#rStripe");
const OBS=[
  {w:46,h:42,html:'<svg viewBox="0 0 40 34" preserveAspectRatio="none" style="width:100%;height:100%"><path d="M3 34 q3 -24 17 -26 q17 2 17 26z" fill="#8E8579" stroke="#2E2A22" stroke-width="2.4"/><path d="M12 24 q6 -8 14 -4" stroke="#6E675C" stroke-width="2.4" fill="none"/></svg>'},
  {w:68,h:62,html:'<svg viewBox="0 0 48 44" preserveAspectRatio="none" style="width:100%;height:100%"><path d="M5 44 q3 -32 19 -34 q19 2 19 34z" fill="#7B7368" stroke="#2E2A22" stroke-width="2.4"/><path d="M14 34 q6 -10 14 -6" stroke="#615A50" stroke-width="2.2" fill="none"/></svg>'},
  {w:52,h:86,html:'<svg viewBox="0 0 36 58" preserveAspectRatio="none" style="width:100%;height:100%"><rect x="14" y="24" width="8" height="34" fill="#8A6A44"/><ellipse cx="18" cy="21" rx="17" ry="20" fill="#5C8A44" stroke="#2E2A22" stroke-width="2.2"/><ellipse cx="13" cy="15" rx="6" ry="7" fill="#7FA855" opacity=".8"/></svg>'}
];
function rReset(){
  R.obs.forEach(o=>o.el.remove()); R.obs=[];
  R.y=0; R.vy=0; R.ground=true; R.dist=0; R.speed=340; R.spawn=1.7; R.over=false; R.t=0;
  $("#rOver").classList.remove("on");
  $("#rDist").textContent="0";
  $("#rHint").style.opacity="1";
  rRunner.style.transform="translateY(0)";
}
function rStart(){
  if(S.energy<12){ bubble("太累了，先睡一觉",2000); Audio2.dull(); return; }
  closeSheets();
  if(A.sleeping) wake();
  Audio2.ac();
  $("#runner").classList.add("on");
  R.on=true; rReset();
  cancelAnimationFrame(R.raf);
  rLast=performance.now();
  R.raf=requestAnimationFrame(rLoop);
}
function rQuit(){
  R.on=false; cancelAnimationFrame(R.raf);
  $("#runner").classList.remove("on");
  R.obs.forEach(o=>o.el.remove()); R.obs=[];
}
function rJump(){
  if(!R.on||R.over) return;
  if(R.ground){ R.vy=-720; R.ground=false; Audio2.jump(); $("#rHint").style.opacity="0"; }
}
function rDie(){
  R.over=true;
  Audio2.bonk();
  const d=Math.round(R.dist);
  const earn=Math.max(1,Math.floor(d/18));
  if(d>S.best){ S.best=d; $("#rTitle").textContent="新纪录！"; }
  else $("#rTitle").textContent="哎呀，绊住了";
  $("#rScore").textContent=d;
  $("#rEarn").textContent=earn;
  coins(earn);
  gain("energy",-8); gain("mood",4);
  $("#rOver").classList.add("on");
}
let rLast=0;
function rLoop(now){
  if(!R.on) return;
  const dt=Math.min(.04,(now-rLast)/1000); rLast=now;
  if(!R.over){
    R.t+=dt;
    R.speed=340+Math.min(300,R.t*14);
    R.dist+=R.speed*dt/26;
    $("#rDist").textContent=Math.round(R.dist);

    // 物理
    R.vy+=1900*dt;
    R.y=Math.min(0,R.y+R.vy*dt);
    if(R.y>=0){ R.y=0; R.vy=0; R.ground=true; }
    const runBob=R.ground?Math.abs(Math.sin(R.t*15))*4:0;
    const tilt=R.ground?0:clamp(R.vy/60,-9,12);
    rRunner.style.transform=`translateY(${(R.y-runBob).toFixed(1)}px) rotate(${tilt.toFixed(1)}deg)`;
    const air=clamp(-R.y/136,0,1);
    $("#rShadow").style.transform=`scale(${(1-air*.45).toFixed(2)})`;
    $("#rShadow").style.opacity=(.32-air*.18).toFixed(2);
    $("#rLegB").setAttribute("transform",`translate(0,${(R.ground?Math.sin(R.t*15)*5:4).toFixed(1)})`);
    $("#rLegF").setAttribute("transform",`translate(0,${(R.ground?-Math.sin(R.t*15)*5:4).toFixed(1)})`);
    $("#rTail").setAttribute("transform",`rotate(${(Math.sin(R.t*9)*10).toFixed(1)} 18 62)`);

    // 地面条纹
    const sp=(R.t*R.speed)%52;
    rStripe.style.transform=`translateX(${-sp.toFixed(1)}px)`;

    // 生成障碍
    R.spawn-=dt;
    if(R.spawn<=0){
      R.spawn=rnd(.72,1.35)*(340/R.speed)+.28;
      const o=OBS[Math.floor(Math.random()*OBS.length)];
      const d=document.createElement("div");
      d.className="obs";
      d.style.width=o.w+"px"; d.style.height=o.h+"px";
      d.innerHTML=o.html;
      d.style.left="0px";
      rField.appendChild(d);
      R.obs.push({el:d,x:rField.clientWidth+20,w:o.w,h:o.h});
    }

    // 移动 / 碰撞
    const fh=rField.clientHeight;
    const gTop=$("#rGround").offsetHeight; // 与 CSS --gh 保持一致
    const rr=rRunner.getBoundingClientRect();
    const fr=rField.getBoundingClientRect();
    const rx=rr.left-fr.left+rr.width*.30, rw=rr.width*.44;
    const ryTop=rr.top-fr.top+rr.height*.3;
    for(let i=R.obs.length-1;i>=0;i--){
      const ob=R.obs[i];
      ob.x-=R.speed*dt;
      ob.el.style.transform=`translateX(${ob.x.toFixed(1)}px)`;
      if(ob.x<-70){ ob.el.remove(); R.obs.splice(i,1); continue; }
      const oy=fh-gTop-ob.h;
      if(ob.x < rx+rw && ob.x+ob.w > rx){
        const rBottom=rr.bottom-fr.top;
        if(rBottom > oy+10){ rDie(); break; }
      }
    }
  }
  R.raf=requestAnimationFrame(rLoop);
}
$("#tPlay").addEventListener("click",rStart);
$("#rQuit").addEventListener("click",rQuit);
$("#rAgain").addEventListener("click",()=>{ rReset(); rLast=performance.now(); });
rField.addEventListener("pointerdown",rJump);
document.addEventListener("keydown",(e)=>{
  if(e.code==="Space"||e.code==="ArrowUp"){
    if(R.on){ e.preventDefault(); if(R.over) { rReset(); rLast=performance.now(); } else rJump(); }
  }
  if(e.key==="Escape"){ if(R.on) rQuit(); else closeSheets(); }
});

/* ================= 草丛细节 ================= */
(function tufts(){
  const g=$("#ground");
  for(let i=0;i<46;i++){
    const d=document.createElement("div");
    d.className="tuft";
    const near=Math.random();
    d.style.left=rnd(-1,101)+"%";
    d.style.height=(near*16+9).toFixed(0)+"px";
    d.style.bottom=rnd(-2,66)+"%";
    d.style.opacity=(.45+near*.45).toFixed(2);
    d.style.transformOrigin="50% 100%";
    d.style.transform=`rotate(${rnd(-20,20).toFixed(1)}deg)`;
    g.appendChild(d);
  }
})();

/* ================= 云飘 ================= */
(function drift(){
  if(reduced) return;
  const cs=[["#c1",.0045],["#c2",.0028],["#c3",.0062]];
  const start=performance.now();
  (function step(now){
    const el2=(now-start)/1000;
    cs.forEach(([sel,sp],i)=>{
      const n=$(sel);
      const x=((el2*sp*100)+i*18)%140-20;
      n.style.transform=`translateX(${x.toFixed(2)}vw)`;
    });
    requestAnimationFrame(step);
  })(start);
})();

/* ================= 开机 ================= */
function start(hot){
  if(hot && typeof hot==="object" && hot.S && typeof hot.S==="object"){
    Object.assign(S,hot.S);
  } else {
    load();
  }
  hud(); applyHat(); buildFoods(); buildHats(); buildPresets();
  requestAnimationFrame(loop);
  setTimeout(()=>{
    bubble("哞——我是牛来，摸摸我",2600);
    A.nod=.5;
  },700);
  // 首次进来给一点提示
  setTimeout(()=>{
    if(S.coins<=12 && S.best===0) bubble("点我的头、角、肚子、尾巴试试",2800);
  },4200);
}
try{
  window.claude?.hot?.snapshot?.(()=>({S}));
}catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(start);
else start(window.claude?.hot?.data ?? null);
</script>
